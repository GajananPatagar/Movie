plugins { id 'com.android.application' }
android {
    namespace 'com.moviehub.pro'
    compileSdk 34
    defaultConfig {
        applicationId "com.moviehub.pro"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.0-Pro"
    }
    buildTypes {
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
